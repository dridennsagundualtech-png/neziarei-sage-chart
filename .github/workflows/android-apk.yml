name: Android APK

# Builds the ChartPilot Android app and attaches the APK to a GitHub Release.
# Start it by pushing to the "apk" branch (for example: git push origin main:apk),
# by pushing a tag that begins with "apk-", or from the Actions tab with "Run workflow".
on:
  push:
    branches: [apk]
    tags: ["apk-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu runner already ships the Android SDK (ANDROID_HOME); Gradle fetches
      # any missing platform itself.
      - name: Check the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Install dependencies
        run: |
          set -o pipefail
          (bun install --frozen-lockfile || bun install) 2>&1 | tee -a build.log

      - name: Build the web app (static, for Android)
        env:
          # Server functions (AI, analysis, premium checks) run on the hosted app.
          VITE_NATIVE_BACKEND_URL: https://neziarei-sage-chart.lovable.app
        run: |
          set -o pipefail
          node scripts/build-spa.mjs 2>&1 | tee -a build.log
          node scripts/finalize-spa.mjs 2>&1 | tee -a build.log

      - name: Copy the web app into the Android project
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee -a build.log

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee -a ../build.log

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChartPilot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChartPilot-apk
          path: ChartPilot.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ChartPilot build ${{ github.run_number }}
          make_latest: true
          files: ChartPilot.apk
          body: |
            ChartPilot Android app, build ${{ github.run_number }}.
            Download ChartPilot.apk on your phone and open it to install.
            If Android asks, allow installing apps from this source.

      # Logs are not always readable from outside; put the end of the log in an annotation.
      - name: Report the failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(grep -v "^\s*$" build.log | tail -n 30 | cut -c1-200 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::${msg}"
          else
            echo "::error title=Build failed::No build.log (failed before install)"
          fi
